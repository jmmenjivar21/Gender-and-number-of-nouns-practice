<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Articles Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f4f0;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1c; color: #e8e6df; }
    }

    #qw {
      width: 100%;
      max-width: 660px;
    }

    /* Header */
    .quiz-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .quiz-header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      color: #D85A30;
      margin-bottom: 0.25rem;
    }
    .quiz-header p {
      font-size: 13px;
      color: #888780;
    }

    /* Progress */
    .prog-bg {
      background: #e2e0d8;
      border-radius: 99px;
      height: 6px;
      margin-bottom: 1.25rem;
    }
    @media (prefers-color-scheme: dark) { .prog-bg { background: #2e2e2c; } }
    .prog-fill {
      background: #D85A30;
      height: 6px;
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 6px;
    }
    .q-counter { font-size: 13px; color: #888780; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 500;
    }
    .b-def  { background: #EEEDFE; color: #3C3489; }
    .b-indef{ background: #E1F5EE; color: #085041; }
    .b-m    { background: #E6F1FB; color: #0C447C; }
    .b-f    { background: #FBEAF0; color: #72243E; }
    .b-s    { background: #FAEEDA; color: #633806; }
    .b-p    { background: #EAF3DE; color: #27500A; }
    @media (prefers-color-scheme: dark) {
      .b-def  { background: #3C3489; color: #CECBF6; }
      .b-indef{ background: #085041; color: #9FE1CB; }
      .b-m    { background: #0C447C; color: #B5D4F4; }
      .b-f    { background: #72243E; color: #F4C0D1; }
      .b-s    { background: #633806; color: #FAC775; }
      .b-p    { background: #27500A; color: #C0DD97; }
    }

    /* Noun display */
    .noun-box { text-align: center; margin: 1.1rem 0 0.75rem; }
    .noun-prompt { font-size: 13px; color: #888780; margin-bottom: 0.4rem; }
    .noun-word {
      font-size: 2.4rem;
      font-weight: 500;
      color: #1a1a18;
      letter-spacing: -0.5px;
    }
    @media (prefers-color-scheme: dark) { .noun-word { color: #e8e6df; } }
    .noun-hint-eng { font-size: 13px; color: #888780; margin-top: 0.2rem; }

    /* Hint row */
    .hint-row {
      display: flex;
      justify-content: center;
      margin-bottom: 0.9rem;
      min-height: 32px;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #hint-btn {
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 99px;
      border: 0.5px solid #c8c6be;
      background: #fff;
      cursor: pointer;
      color: #5f5e5a;
      transition: background 0.12s, color 0.12s;
    }
    #hint-btn:hover:not(:disabled) { background: #f0ede8; color: #1a1a18; }
    #hint-btn:disabled { opacity: 0.4; cursor: default; }
    @media (prefers-color-scheme: dark) {
      #hint-btn { background: #2a2a28; border-color: #444441; color: #b4b2a9; }
      #hint-btn:hover:not(:disabled) { background: #333331; color: #e8e6df; }
    }
    #hint-text { font-size: 13px; color: #888780; display: none; }
    #hint-text.show { display: inline; }
    .hint-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 500;
      margin: 0 2px;
    }

    /* Choices */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.1rem;
    }
    .cbtn {
      padding: 0.85rem 0.5rem;
      border-radius: 12px;
      border: 0.5px solid #c8c6be;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
    }
    .cbtn:hover:not(:disabled) { background: #f0ede8; border-color: #888780; }
    .cbtn:active:not(:disabled) { transform: scale(0.98); }
    .cbtn .art {
      font-size: 1.4rem;
      font-weight: 500;
      color: #1a1a18;
      display: block;
    }
    .cbtn .lbl {
      font-size: 11px;
      color: #888780;
      margin-top: 3px;
      display: block;
      line-height: 1.3;
    }
    .cbtn.correct { background: #EAF3DE; border-color: #639922; }
    .cbtn.correct .art { color: #3B6D11; }
    .cbtn.wrong   { background: #FCEBEB; border-color: #E24B4A; }
    .cbtn.wrong .art { color: #A32D2D; }
    @media (prefers-color-scheme: dark) {
      .cbtn { background: #2a2a28; border-color: #444441; }
      .cbtn .art { color: #e8e6df; }
      .cbtn:hover:not(:disabled) { background: #333331; border-color: #888780; }
      .cbtn.correct { background: #27500A; border-color: #639922; }
      .cbtn.correct .art { color: #C0DD97; }
      .cbtn.wrong   { background: #501313; border-color: #E24B4A; }
      .cbtn.wrong .art { color: #F7C1C1; }
    }

    /* Feedback */
    .feedback {
      min-height: 36px;
      text-align: center;
      font-size: 13px;
      color: #888780;
      margin-bottom: 0.9rem;
      line-height: 1.5;
    }
    .fb-ok { color: #3B6D11; }
    .fb-no { color: #A32D2D; }
    @media (prefers-color-scheme: dark) {
      .fb-ok { color: #97C459; }
      .fb-no { color: #F09595; }
    }

    /* Next button */
    #nxt {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: 0.5px solid #c8c6be;
      background: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      color: #1a1a18;
      display: none;
      transition: background 0.12s;
    }
    #nxt:hover { background: #f0ede8; }
    @media (prefers-color-scheme: dark) {
      #nxt { background: #2a2a28; border-color: #444441; color: #e8e6df; }
      #nxt:hover { background: #333331; }
    }

    /* Results */
    #res { display: none; padding: 1.5rem 0; }
    .score-ring {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid #D85A30;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .score-ring .sn { font-size: 2rem; font-weight: 500; color: #1a1a18; }
    .score-ring .sd { font-size: 13px; color: #888780; }
    @media (prefers-color-scheme: dark) { .score-ring .sn { color: #e8e6df; } }
    .res-msg { text-align: center; font-size: 1.1rem; font-weight: 500; margin-bottom: 0.3rem; }
    .res-sub { text-align: center; font-size: 13px; color: #888780; margin-bottom: 1.25rem; }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 480px) { .stats-row { grid-template-columns: 1fr 1fr; } }
    .sc {
      background: #eeece6;
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) { .sc { background: #2a2a28; } }
    .sc .sv { font-size: 1.2rem; font-weight: 500; }
    .sc .sl { font-size: 11px; color: #888780; margin-top: 2px; }

    .rev-hdr {
      font-size: 12px; font-weight: 500; color: #888780;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
    }
    .rev-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      font-size: 13px; gap: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .rev-item { border-bottom-color: rgba(255,255,255,0.08); }
    }
    .ri-left { flex: 1; }
    .ri-noun { font-weight: 500; }
    .ri-meaning { color: #888780; }
    .ri-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ri-c { color: #3B6D11; }
    .ri-w { color: #A32D2D; }
    @media (prefers-color-scheme: dark) {
      .ri-c { color: #97C459; }
      .ri-w { color: #F09595; }
    }
    .arrow { color: #b4b2a9; font-size: 12px; }
    .ri-label { font-size: 11px; color: #888780; }

    #restart {
      margin-top: 1.5rem; width: 100%; padding: 0.7rem;
      border-radius: 8px; border: 0.5px solid #D85A30;
      background: transparent; font-size: 15px; font-weight: 500;
      cursor: pointer; color: #D85A30; transition: background 0.12s;
    }
    #restart:hover { background: #FAECE7; }
    @media (prefers-color-scheme: dark) {
      #restart { color: #F0997B; border-color: #993C1D; }
      #restart:hover { background: #4A1B0C; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
<div id="qw">
  <h2 class="sr-only">Spanish articles quiz — practice definite and indefinite articles with gender and number for 50 Spanish nouns</h2>

  <div class="quiz-header">
    <h1>Spanish Articles Quiz</h1>
    <p>Choose the correct definite or indefinite article for each noun</p>
  </div>

  <div id="quiz-sec">
    <div class="prog-bg"><div class="prog-fill" id="pf" style="width:0%"></div></div>
    <div class="q-meta">
      <span class="q-counter" id="qc">Question 1 of 50</span>
      <div class="badges" id="badges"></div>
    </div>
    <div class="noun-box">
      <div class="noun-prompt" id="prompt"></div>
      <div class="noun-word" id="noun"></div>
      <div class="noun-hint-eng" id="hint-eng"></div>
    </div>
    <div class="hint-row">
      <button id="hint-btn">Show hint</button>
      <span id="hint-text"></span>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="fb"></div>
    <button id="nxt">Continue →</button>
  </div>

  <div id="res">
    <div style="text-align:center">
      <div class="score-ring">
        <span class="sn" id="fscore">0</span>
        <span class="sd" id="score-denom">/ 50</span>
      </div>
      <div class="res-msg" id="rmsg"></div>
      <div class="res-sub" id="rsub"></div>
    </div>
    <div class="stats-row">
      <div class="sc"><div class="sv ri-c" id="st-ok">0</div><div class="sl">Correct</div></div>
      <div class="sc"><div class="sv ri-w" id="st-wr">0</div><div class="sl">Incorrect</div></div>
      <div class="sc"><div class="sv" id="st-hints">0</div><div class="sl">Hints used</div></div>
      <div class="sc"><div class="sv" id="st-pct">0%</div><div class="sl">Score</div></div>
    </div>
    <div id="rev-list"></div>
    <button id="restart">Intentar de nuevo ↺</button>
  </div>
</div>

<script>
  const QDB = [
    {noun:"libro",    meaning:"book",           gender:"m", number:"s", type:"def"},
    {noun:"libros",   meaning:"books",           gender:"m", number:"p", type:"def"},
    {noun:"casa",     meaning:"house",           gender:"f", number:"s", type:"def"},
    {noun:"casas",    meaning:"houses",          gender:"f", number:"p", type:"def"},
    {noun:"perro",    meaning:"dog",             gender:"m", number:"s", type:"indef"},
    {noun:"gatos",    meaning:"cats",            gender:"m", number:"p", type:"indef"},
    {noun:"mesa",     meaning:"table",           gender:"f", number:"s", type:"indef"},
    {noun:"flores",   meaning:"flowers",         gender:"f", number:"p", type:"indef"},
    {noun:"maestro",  meaning:"teacher (m)",     gender:"m", number:"s", type:"def"},
    {noun:"maestra",  meaning:"teacher (f)",     gender:"f", number:"s", type:"def"},
    {noun:"niños",    meaning:"children",        gender:"m", number:"p", type:"def"},
    {noun:"niñas",    meaning:"girls",           gender:"f", number:"p", type:"def"},
    {noun:"coche",    meaning:"car",             gender:"m", number:"s", type:"indef"},
    {noun:"coches",   meaning:"cars",            gender:"m", number:"p", type:"indef"},
    {noun:"ciudad",   meaning:"city",            gender:"f", number:"s", type:"def"},
    {noun:"ciudades", meaning:"cities",          gender:"f", number:"p", type:"def"},
    {noun:"estudiante",  meaning:"student (m)",  gender:"m", number:"s", type:"indef"},
    {noun:"estudiantes", meaning:"students",     gender:"f", number:"p", type:"indef"},
    {noun:"mano",     meaning:"hand",            gender:"f", number:"s", type:"def"},
    {noun:"manos",    meaning:"hands",           gender:"f", number:"p", type:"indef"},
    {noun:"problema", meaning:"problem",         gender:"m", number:"s", type:"def",   hintNote:"Ends in -a but is masculine"},
    {noun:"problemas",meaning:"problems",        gender:"m", number:"p", type:"indef", hintNote:"Ends in -a but is masculine"},
    {noun:"lección",  meaning:"lesson",          gender:"f", number:"s", type:"indef"},
    {noun:"lecciones",meaning:"lessons",         gender:"f", number:"p", type:"def"},
    {noun:"día",      meaning:"day",             gender:"m", number:"s", type:"def",   hintNote:"Ends in -a but is masculine"},
    {noun:"escuela",  meaning:"school",          gender:"f", number:"s", type:"def"},
    {noun:"escuelas", meaning:"schools",         gender:"f", number:"p", type:"indef"},
    {noun:"amigo",    meaning:"friend (m)",      gender:"m", number:"s", type:"indef"},
    {noun:"amigos",   meaning:"friends (m)",     gender:"m", number:"p", type:"def"},
    {noun:"amiga",    meaning:"friend (f)",      gender:"f", number:"s", type:"def"},
    {noun:"amigas",   meaning:"friends (f)",     gender:"f", number:"p", type:"indef"},
    {noun:"ventana",  meaning:"window",          gender:"f", number:"s", type:"indef"},
    {noun:"ventanas", meaning:"windows",         gender:"f", number:"p", type:"def"},
    {noun:"árbol",    meaning:"tree",            gender:"m", number:"s", type:"def"},
    {noun:"árboles",  meaning:"trees",           gender:"m", number:"p", type:"indef"},
    {noun:"agua",     meaning:"water",           gender:"f", number:"s", type:"def",   hintNote:"Feminine but uses 'el' in singular to avoid double vowel sound"},
    {noun:"aguas",    meaning:"waters",          gender:"f", number:"p", type:"def"},
    {noun:"mapa",     meaning:"map",             gender:"m", number:"s", type:"indef", hintNote:"Ends in -a but is masculine"},
    {noun:"mapas",    meaning:"maps",            gender:"m", number:"p", type:"def",   hintNote:"Ends in -a but is masculine"},
    {noun:"sistema",  meaning:"system",          gender:"m", number:"s", type:"def",   hintNote:"Ends in -a but is masculine"},
    {noun:"sistemas", meaning:"systems",         gender:"m", number:"p", type:"indef", hintNote:"Ends in -a but is masculine"},
    {noun:"noche",    meaning:"night",           gender:"f", number:"s", type:"def"},
    {noun:"noches",   meaning:"nights",          gender:"f", number:"p", type:"indef"},
    {noun:"planeta",  meaning:"planet",          gender:"m", number:"s", type:"def",   hintNote:"Ends in -a but is masculine"},
    {noun:"planetas", meaning:"planets",         gender:"m", number:"p", type:"indef", hintNote:"Ends in -a but is masculine"},
    {noun:"tarea",    meaning:"homework",        gender:"f", number:"s", type:"indef"},
    {noun:"tareas",   meaning:"assignments",     gender:"f", number:"p", type:"def"},
    {noun:"examen",   meaning:"exam",            gender:"m", number:"s", type:"indef"},
    {noun:"exámenes", meaning:"exams",           gender:"m", number:"p", type:"def"},
    {noun:"canción",  meaning:"song",            gender:"f", number:"s", type:"def"},
    {noun:"canciones",meaning:"songs",           gender:"f", number:"p", type:"indef"},
  ];

  const DEF    = {ms:"el",  fs:"la",  mp:"los", fp:"las"};
  const INDEF  = {ms:"un",  fs:"una", mp:"unos",fp:"unas"};
  const ALL_ARTS = {
    def:  [{a:"el",k:"ms"},{a:"la",k:"fs"},{a:"los",k:"mp"},{a:"las",k:"fp"}],
    indef:[{a:"un",k:"ms"},{a:"una",k:"fs"},{a:"unos",k:"mp"},{a:"unas",k:"fp"}],
  };
  const LABELS     = {ms:"masculine singular",fs:"feminine singular",mp:"masculine plural",fp:"feminine plural"};
  const GEND_LABEL = {m:"masculine", f:"feminine"};
  const NUM_LABEL  = {s:"singular",  p:"plural"};

  function key(g, n) { return (g === "m" ? "m" : "f") + (n === "s" ? "s" : "p"); }
  function shuffle(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
  }

  let qs, cur, score, hintsUsed, results, answered;

  function init() {
    qs = shuffle(QDB);
    cur = 0; score = 0; hintsUsed = 0; results = []; answered = false;
    document.getElementById('quiz-sec').style.display = '';
    document.getElementById('res').style.display = 'none';
    showQ();
  }

  function showQ() {
    answered = false;
    const q = qs[cur];
    const total = qs.length;
    document.getElementById('pf').style.width = ((cur / total) * 100) + '%';
    document.getElementById('qc').textContent = `Question ${cur + 1} of ${total}`;

    const k = key(q.gender, q.number);
    const isM = q.gender === 'm', isS = q.number === 's', isDef = q.type === 'def';

    document.getElementById('badges').innerHTML =
      `<span class="badge ${isDef ? 'b-def' : 'b-indef'}">${isDef ? 'Definite' : 'Indefinite'}</span>`;

    document.getElementById('prompt').textContent =
      `Choose the correct ${isDef ? 'definite' : 'indefinite'} article:`;
    document.getElementById('noun').textContent = q.noun;
    document.getElementById('hint-eng').textContent = `"${q.meaning}"`;

    const hb = document.getElementById('hint-btn');
    const ht = document.getElementById('hint-text');
    hb.textContent = 'Show hint';
    hb.disabled = false;
    ht.className = '';
    ht.innerHTML = '';

    hb.onclick = function () {
      if (answered) return;
      hintsUsed++;
      hb.disabled = true;
      hb.textContent = 'Hint shown';
      const gBadge = `<span class="hint-tag ${isM ? 'b-m' : 'b-f'}">${GEND_LABEL[q.gender]}</span>`;
      const nBadge = `<span class="hint-tag ${isS ? 'b-s' : 'b-p'}">${NUM_LABEL[q.number]}</span>`;
      const extra = q.hintNote ? ` &mdash; <em>${q.hintNote}</em>` : '';
      ht.innerHTML = gBadge + nBadge + extra;
      ht.className = 'show';
    };

    document.getElementById('fb').textContent = '';
    document.getElementById('fb').className = 'feedback';
    document.getElementById('nxt').style.display = 'none';

    const arts = ALL_ARTS[q.type];
    const cc = document.getElementById('choices');
    cc.innerHTML = '';
    arts.forEach(({ a, k: ak }) => {
      const btn = document.createElement('button');
      btn.className = 'cbtn';
      btn.innerHTML = `<span class="art">${a}</span><span class="lbl">${LABELS[ak]}</span>`;
      btn.addEventListener('click', () => pick(a, k, q, btn));
      cc.appendChild(btn);
    });
  }

  function pick(chosen, correctKey, q, btn) {
    if (answered) return;
    answered = true;
    const map = q.type === 'def' ? DEF : INDEF;
    const correctArt = map[correctKey];
    const isRight = chosen === correctArt;
    if (isRight) score++;

    document.getElementById('hint-btn').disabled = true;
    document.querySelectorAll('.cbtn').forEach(b => {
      b.disabled = true;
      if (b.querySelector('.art').textContent === correctArt) b.classList.add('correct');
    });
    if (!isRight) btn.classList.add('wrong');

    const fb = document.getElementById('fb');
    if (isRight) {
      fb.textContent = `Correct! ${correctArt} ${q.noun} — "${q.meaning}"`;
      fb.className = 'feedback fb-ok';
    } else {
      fb.textContent = `The correct answer is ${correctArt} ${q.noun} (${LABELS[correctKey]})`;
      fb.className = 'feedback fb-no';
    }
    results.push({ noun: q.noun, meaning: q.meaning, correct: correctArt, chosen, isRight, correctKey });
    document.getElementById('nxt').style.display = 'block';
  }

  document.getElementById('nxt').addEventListener('click', () => {
    cur++;
    if (cur >= qs.length) showResults();
    else showQ();
  });

  function showResults() {
    document.getElementById('pf').style.width = '100%';
    document.getElementById('quiz-sec').style.display = 'none';
    document.getElementById('res').style.display = '';
    const total = qs.length;
    const pct = Math.round((score / total) * 100);
    document.getElementById('fscore').textContent = score;
    document.getElementById('score-denom').textContent = '/ ' + total;
    document.getElementById('st-ok').textContent = score;
    document.getElementById('st-wr').textContent = total - score;
    document.getElementById('st-hints').textContent = hintsUsed;
    document.getElementById('st-pct').textContent = pct + '%';

    let msg, sub;
    if (pct >= 92)      { msg = '¡Excelente!';          sub = 'Outstanding command of Spanish articles.'; }
    else if (pct >= 76) { msg = '¡Muy bien!';            sub = 'Just a few articles to review — great effort.'; }
    else if (pct >= 60) { msg = '¡Bien hecho!';          sub = "Keep practising — you're on the right track."; }
    else                { msg = '¡Sigue practicando!';   sub = 'Review the nouns below and try again.'; }

    document.getElementById('rmsg').textContent = msg;
    document.getElementById('rsub').textContent = sub;

    const wrongs = results.filter(r => !r.isRight);
    const rl = document.getElementById('rev-list');
    if (!wrongs.length) {
      rl.innerHTML = '<div class="rev-hdr" style="text-align:center">Perfect score — ¡perfecto!</div>';
    } else {
      rl.innerHTML = '<div class="rev-hdr">Review these nouns</div>' +
        wrongs.map(r => `
          <div class="rev-item">
            <div class="ri-left">
              <span class="ri-noun">${r.noun}</span>
              <span class="ri-meaning"> — "${r.meaning}"</span>
            </div>
            <div class="ri-right">
              <span class="ri-w">${r.chosen}</span>
              <span class="arrow">→</span>
              <span class="ri-c">${r.correct}</span>
              <span class="ri-label">(${LABELS[r.correctKey]})</span>
            </div>
          </div>`).join('');
    }
  }

  document.getElementById('restart').addEventListener('click', init);
  init();
</script>
</body>
</html>
